<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Srigiri Sri Venkateswara Swamy — Full Site</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Noto+Serif+Telugu:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');



        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
        }

        .nav-links a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-links a.active {
            color: var(--gold, #D4AF37);
            border-bottom: 1.5px solid var(--gold, #D4AF37);
            padding-bottom: 3px;
        }

        @media (max-width:860px) {
            .nav-links a {
                display: block;
            }
        }


        /* ===== Home ===== */
        :root {
            --cream: #FBF3E7;
            --cream-2: #F5EBDB;
            --terracotta-1: #C1622D;
            --terracotta-2: #E8954B;
            --ink: #3A2415;
            --maroon: #2B160D;
            --gold: #D4AF37;
        }

        .scope-home * {
            box-sizing: border-box;
        }

        .scope-home body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--ink);
            background: var(--cream);
            -webkit-text-size-adjust: 100%;
        }

        .scope-home img {
            display: block;
            max-width: 100%;
        }

        .scope-home .ornate-header img {
            width: 100%;
            height: auto;
            display: block;
        }

        .scope-home .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: var(--maroon);
            color: #f1e6d8;
            position: relative;
        }

        .scope-home .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scope-home .nav-icon {
            width: 30px;
            height: 30px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 13px;
            flex-shrink: 0;
        }

        .scope-home .nav-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .scope-home .nav-sub {
            font-size: 9.5px;
            letter-spacing: .08em;
            color: #c7a582;
        }

        .scope-home .nav-links {
            display: flex;
            gap: 24px;
            font-size: 13.5px;
            color: #e7d9c8;
        }

        .scope-home .nav-links span.active {
            color: var(--gold);
            border-bottom: 1.5px solid var(--gold);
            padding-bottom: 3px;
        }

        .scope-home .nav-cta {
            background: var(--gold);
            color: var(--maroon);
            padding: 9px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .scope-home .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 6px;
        }

        .scope-home .hamburger span {
            width: 22px;
            height: 2px;
            background: #f1e6d8;
            display: block;
        }

        .scope-home #navToggle {
            display: none;
        }

        @media (max-width:900px) {
            .scope-home .nav {
                padding: 14px 40px;
            }
        }

        @media (max-width:860px) {
            .scope-home .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--maroon);
                flex-direction: column;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height .25s ease;
                border-top: 1px solid rgba(255, 255, 255, .08);
            }

            .scope-home #navToggle:checked~.nav-links {
                max-height: 400px;
            }

            .scope-home .nav-links span {
                padding: 14px 40px;
                border-bottom: 1px solid rgba(255, 255, 255, .06);
            }

            .scope-home .nav-links span.active {
                border-bottom: 1px solid rgba(255, 255, 255, .06);
            }

            .scope-home .hamburger {
                display: flex;
            }

            .scope-home .nav-cta {
                display: none;
            }
        }

        .scope-home .pillar-frame {
            position: relative;
        }

        .scope-home .pillar-frame>.pillar-left,
        .scope-home .pillar-frame>.pillar-right {
            position: absolute;
            top: 0;
            width: 70px;
            height: 100%;
            z-index: 5;
            object-fit: cover;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 65%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 0%, black 65%, transparent 100%);
        }

        .scope-home .pillar-frame>.pillar-left {
            left: 0;
        }

        .scope-home .pillar-frame>.pillar-right {
            right: 0;
        }

        @media (max-width:900px) {

            .scope-home .pillar-frame>.pillar-left,
            .scope-home .pillar-frame>.pillar-right {
                display: none;
            }
        }

        .scope-home .ornate-header {
            height: 220px;
            overflow: hidden;
            background: #FBF3E7;
        }

        .scope-home .ornate-header img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: center center;
            filter: brightness(1.04) contrast(1.05) saturate(1.03);
        }

        .scope-home .nav {
            min-height: 76px;
            padding: 12px 40px;
            background: var(--maroon);
            z-index: 20;
        }

        .scope-home .nav-left {
            gap: 12px;
        }

        .scope-home .nav-icon {
            width: 38px;
            height: 38px;
            font-size: 15px;
        }

        .scope-home .nav-title {
            font-size: 16px;
        }

        .scope-home .nav-sub {
            font-size: 9.5px;
        }

        .scope-home .nav-links {
            gap: 25px;
        }

        .scope-home .nav-cta {
            padding: 11px 20px;
        }

        .scope-home .hero {
            height: 680px;
            background: #24130d;
            position: relative;
            overflow: hidden;
        }

        .scope-home .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(35, 15, 8, .78) 0%, rgba(35, 15, 8, .54) 35%, rgba(35, 15, 8, .10) 68%, rgba(35, 15, 8, .05) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .scope-home .hero-body {
            max-width: none;
            width: 100%;
            height: 680px;
            margin: 0;
            padding: 0;
            display: block;
            position: relative;
        }

        .scope-home .photo-wrap {
            position: absolute;
            inset: 0;
            display: block;
            z-index: 0;
        }

        .scope-home .ref-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 56%;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            filter: brightness(1.10) contrast(1.08) saturate(1.04);
        }

        .scope-home .hero-copy {
            position: absolute;
            z-index: 2;
            left: 7vw;
            top: 50%;
            transform: translateY(-50%);
            max-width: 600px;
            padding: 0;
        }

        .scope-home .hero-copy .eyebrow-te {
            font-family: "Noto Serif Telugu", serif;
            color: #fff;
            font-size: 31px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 18px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
        }

        .scope-home .hero-copy h2 {
            font-family: "Fraunces", serif;
            color: #fff;
            font-weight: 600;
            font-size: 50px;
            line-height: 1.08;
            margin: 0 0 18px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, .4);
        }

        .scope-home .hero-copy p.desc {
            color: #fff4e5;
            font-size: 17px;
            max-width: 520px;
            margin: 0 0 28px;
            text-shadow: 0 2px 7px rgba(0, 0, 0, .4);
        }

        .scope-home .btn-row {
            display: flex;
            gap: 13px;
            flex-wrap: wrap;
        }

        .scope-home .btn-primary {
            display: inline-block;
            background: var(--maroon);
            color: #f8e9d2;
            border: 1px solid rgba(255, 255, 255, .3);
            padding: 13px 22px;
            border-radius: 4px;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .2);
        }

        .scope-home .btn-secondary {
            display: inline-block;
            background: rgba(255, 255, 255, .08);
            border: 1px solid #f7ead7;
            color: #fff8ee;
            padding: 13px 22px;
            border-radius: 4px;
            font-size: 13.5px;
            backdrop-filter: blur(2px);
        }

        .scope-home .story {
            background: var(--cream-2);
            padding: 58px 40px;
        }

        .scope-home .story-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .scope-home .story-eyebrow {
            font-family: "Fraunces", serif;
            font-style: italic;
            color: #8a6a45;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .scope-home .story h3 {
            font-family: "Fraunces", serif;
            font-size: 30px;
            margin: 0 0 14px;
            font-weight: 600;
        }

        .scope-home .story p {
            font-size: 14.5px;
            line-height: 1.65;
            color: #5c4a3a;
            max-width: 480px;
            margin: 0 0 22px;
        }

        .scope-home .story .btn-outline {
            display: inline-block;
            border: 1.3px solid var(--ink);
            color: var(--ink);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
        }

        .scope-home .pull-quote {
            border-left: 3px solid var(--gold);
            padding-left: 20px;
            font-family: "Fraunces", serif;
            font-style: italic;
            font-size: 18px;
            color: var(--ink);
            line-height: 1.55;
        }

        .scope-home .quote-meaning {
            font-family: "Inter", sans-serif;
            font-style: normal;
            font-size: 12.5px;
            color: #8a6a45;
            line-height: 1.6;
            margin-top: 10px;
        }

        @media (max-width:1000px) {
            .scope-home .nav {
                padding: 12px 24px;
            }

            .scope-home .nav-links {
                gap: 15px;
                font-size: 12px;
            }

            .scope-home .nav-cta {
                padding: 10px 14px;
                font-size: 12px;
            }

            .scope-home .hero-copy {
                left: 5vw;
                max-width: 560px;
            }

            .scope-home .hero-copy h2 {
                font-size: 44px;
            }
        }

        @media (max-width:700px) {
            .scope-home .hero {
                height: 560px;
            }

            .scope-home .hero-copy {
                left: 6vw;
                right: 6vw;
                max-width: none;
            }

            .scope-home .hero-copy .eyebrow-te {
                font-size: 24px;
            }

            .scope-home .hero-copy h2 {
                font-size: 32px;
            }

            .scope-home .hero-copy p.desc {
                font-size: 15px;
            }

            .scope-home .story-grid {
                grid-template-columns: 1fr;
                gap: 28px;
            }
        }

        .scope-home .footer {
            background: var(--maroon);
            color: #e7d9c8;
            padding: 48px 24px 20px;
        }

        .scope-home .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .scope-home .footer-te {
            font-family: "Noto Serif Telugu", serif;
            color: #f6e4c9;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .scope-home .footer h3 {
            font-family: "Fraunces", serif;
            color: #fff;
            font-size: 22px;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .scope-home .footer>.footer-inner>p {
            font-size: 13.5px;
            color: #cbb59c;
            margin: 0 0 28px;
            max-width: 480px;
        }

        .scope-home .footer-essentials {
            border-top: 1px solid rgba(255, 255, 255, .12);
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            padding: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 32px;
            justify-content: space-between;
            align-items: baseline;
        }

        .scope-home .footer-contact {
            font-size: 13px;
            color: #e7d9c8;
        }

        .scope-home .footer-trust {
            font-size: 12.5px;
            color: var(--gold);
            font-weight: 600;
        }

        .scope-home .footer-bottom {
            margin-top: 20px;
            padding-top: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            font-size: 11.5px;
            color: #9c8468;
        }

        @media (max-width:700px) {
            .scope-home .footer-essentials {
                flex-direction: column;
                gap: 10px;
            }
        }

        .scope-about .page-hero {
            background: linear-gradient(160deg, var(--terracotta-1), var(--terracotta-2));
            padding: 48px 24px 60px;
            text-align: center;
        }

        .scope-about .page-hero .eyebrow {
            font-family: "Noto Serif Telugu", serif;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .scope-about .page-hero h1 {
            font-family: "Fraunces", serif;
            color: #fff;
            font-size: 34px;
            margin: 0 0 14px;
            font-weight: 600;
        }

        .scope-about .page-hero p {
            color: #fbe9d2;
            font-size: 15px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            white-space: nowrap;
        }

        .scope-about .section {
            max-width: 1160px;
            margin: 0 auto;
            padding: 56px 24px;
        }

        .scope-about .section-head {
            text-align: center;
            margin-bottom: 36px;
        }

        .scope-about .section-head .kicker {
            font-family: "Fraunces", serif;
            font-style: italic;
            color: #8a6a45;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .scope-about .section-head h2 {
            font-family: "Fraunces", serif;
            font-size: 26px;
            margin: 0;
            font-weight: 600;
        }

        .scope-about .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .scope-about .info-card {
            background: #fff;
            border: 1px solid #ecdfc9;
            border-radius: 6px;
            padding: 26px 28px;
        }

        .scope-about .info-card.full {
            grid-column: 1/-1;
        }

        .scope-about .info-card h3 {
            font-family: "Fraunces", serif;
            font-size: 18px;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .scope-about .info-card p {
            font-size: 14px;
            color: #5c4a3a;
            line-height: 1.65;
            margin: 0;
        }

            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

            border: none;
            border-top: 1px solid #ecdfc9;
            margin: 0;
        }

        .scope-about .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .scope-about .card {
            background: #fff;
            border: 1px solid #ecdfc9;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scope-about .card-top {
            padding: 26px 24px 18px;
        }

        .scope-about .card-mark {
            width: 30px;
            height: 3px;
            background: var(--gold);
            margin-bottom: 14px;
        }

        .scope-about .card h3 {
            font-family: "Fraunces", serif;
            font-size: 18px;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .scope-about .card p.teaser {
            font-size: 13.5px;
            color: #6b5744;
            line-height: 1.55;
            margin: 0;
        }

        .scope-about .card-toggle {
            margin: 0 24px 20px;
            padding: 9px 0;
            border: 1px solid var(--ink);
            border-radius: 4px;
            font-size: 12.5px;
            font-weight: 600;
            background: none;
            cursor: pointer;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .scope-about .card-toggle .arrow {
            transition: transform .2s ease;
        }

        .scope-about .card.open .card-toggle .arrow {
            transform: rotate(180deg);
        }

        .scope-about .card-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease;
            border-top: 1px solid #f0e5d2;
            background: #FFFCF6;
        }

        .scope-about .card.open .card-detail {
            max-height: 2200px;
        }

        .scope-about .card-detail-inner {
            padding: 20px 24px 26px;
            font-size: 13px;
            line-height: 1.65;
            color: #5c4a3a;
        }

        .scope-about .card-detail-inner p {
            margin: 0 0 12px;
        }

        .scope-about .card-detail-inner p:last-child {
            margin-bottom: 0;
        }

        .scope-about .card-detail-inner .role {
            margin-bottom: 14px;
        }

        /* ===== Darshan ===== */
        :root {
            --cream: #FBF3E7;
            --cream-2: #F5EBDB;
            --terracotta-1: #C1622D;
            --terracotta-2: #E8954B;
            --ink: #3A2415;
            --maroon: #2B160D;
            --gold: #D4AF37;
        }

        .scope-darshan * {
            box-sizing: border-box;
        }

        .scope-darshan body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--ink);
            background: var(--cream);
            -webkit-text-size-adjust: 100%;
        }

        .scope-darshan img {
            display: block;
            max-width: 100%;
        }

        .scope-darshan .ornate-header img {
            width: 100%;
            height: auto;
            display: block;
        }

        .scope-darshan .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: var(--maroon);
            color: #f1e6d8;
            position: relative;
        }

        .scope-darshan .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scope-darshan .nav-icon {
            width: 30px;
            height: 30px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 13px;
            flex-shrink: 0;
        }

        .scope-darshan .nav-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .scope-darshan .nav-sub {
            font-size: 9.5px;
            letter-spacing: .08em;
            color: #c7a582;
        }

        .scope-darshan .nav-links {
            display: flex;
            gap: 24px;
            font-size: 13.5px;
            color: #e7d9c8;
        }

        .scope-darshan .nav-links span.active {
            color: var(--gold);
            border-bottom: 1.5px solid var(--gold);
            padding-bottom: 3px;
        }

        .scope-darshan .nav-cta {
            background: var(--gold);
            color: var(--maroon);
            padding: 9px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .scope-darshan .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 6px;
        }

        .scope-darshan .hamburger span {
            width: 22px;
            height: 2px;
            background: #f1e6d8;
            display: block;
        }

        .scope-darshan #navToggle {
            display: none;
        }

        @media (max-width:900px) {
            .scope-darshan .nav {
                padding: 14px 40px;
            }
        }

        @media (max-width:860px) {
            .scope-darshan .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--maroon);
                flex-direction: column;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height .25s ease;
                border-top: 1px solid rgba(255, 255, 255, .08);
            }

            .scope-darshan #navToggle:checked~.nav-links {
                max-height: 400px;
            }

            .scope-darshan .nav-links span {
                padding: 14px 40px;
                border-bottom: 1px solid rgba(255, 255, 255, .06);
            }

            .scope-darshan .nav-links span.active {
                border-bottom: 1px solid rgba(255, 255, 255, .06);
            }

            .scope-darshan .hamburger {
                display: flex;
            }

            .scope-darshan .nav-cta {
                display: none;
            }
        }

        .scope-darshan .pillar-frame {
            position: relative;
        }

        .scope-darshan .pillar-frame>.pillar-left,
        .scope-darshan .pillar-frame>.pillar-right {
            position: absolute;
            top: 0;
            width: 70px;
            height: 100%;
            z-index: 5;
            object-fit: cover;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 65%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 0%, black 65%, transparent 100%);
        }

        .scope-darshan .pillar-frame>.pillar-left {
            left: 0;
        }

        .scope-darshan .pillar-frame>.pillar-right {
            right: 0;
        }

        @media (max-width:900px) {

            .scope-darshan .pillar-frame>.pillar-left,
            .scope-darshan .pillar-frame>.pillar-right {
                display: none;
            }
        }

        .scope-darshan .page-hero {
            background: linear-gradient(160deg, var(--terracotta-1), var(--terracotta-2));
            padding: 48px 24px 56px;
            text-align: center;
        }

        .scope-darshan .page-hero .eyebrow {
            font-family: "Noto Serif Telugu", serif;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .scope-darshan .page-hero h1 {
            font-family: "Fraunces", serif;
            color: #fff;
            font-size: 34px;
            margin: 0 0 14px;
            font-weight: 600;
        }

        .scope-darshan .page-hero p {
            color: #fbe9d2;
            font-size: 15px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.65;
        }

        .scope-darshan .section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 52px 24px;
        }

        .scope-darshan .d-group {
            margin-bottom: 40px;
        }

        .scope-darshan .d-group:last-child {
            margin-bottom: 0;
        }

        .scope-darshan .d-group h2 {
            font-family: "Fraunces", serif;
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scope-darshan .d-group h2::before {
            content: "";
            width: 26px;
            height: 3px;
            background: var(--gold);
            display: inline-block;
        }

        .scope-darshan .d-group .note {
            font-size: 13px;
            color: #8a6a45;
            margin: 0 0 18px;
            padding-left: 38px;
        }

        .scope-darshan .info-card {
            background: #fff;
            border: 1px solid #ecdfc9;
            border-radius: 6px;
            padding: 24px 26px;
        }

        .scope-darshan .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #f3ead9;
            flex-wrap: wrap;
        }

        .scope-darshan .info-row:last-child {
            border-bottom: none;
        }

        .scope-darshan .info-row .label {
            font-weight: 600;
            color: var(--ink);
            font-size: 14px;
        }

        .scope-darshan .info-row .value {
            font-size: 13.5px;
            color: #5c4a3a;
            text-align: right;
        }

        .scope-darshan .info-row .value a {
            color: var(--ink);
            text-decoration: underline;
        }

        .scope-darshan .flag {
            background: #fdecec;
            border: 1px solid #e8c4c2;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 12px;
            color: #8a2e2a;
            margin-top: 14px;
        }

        .scope-darshan .map-embed {
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ecdfc9;
            margin-top: 16px;
        }

        .scope-darshan .map-embed iframe {
            width: 100%;
            height: 280px;
            border: 0;
            display: block;
        }

        .scope-darshan .etiquette-list {
            background: #fff;
            border: 1px solid #ecdfc9;
            border-radius: 6px;
            padding: 6px 0;
        }

        .scope-darshan .etiquette-list li {
            list-style: none;
            padding: 12px 22px;
            font-size: 13.5px;
            color: #5c4a3a;
            border-bottom: 1px solid #f3ead9;
        }

        .scope-darshan .etiquette-list li:last-child {
            border-bottom: none;
        }

        .scope-darshan .etiquette-list {
            margin: 0;
        }

        .scope-darshan .policy-notice {
            background: var(--maroon);
            border-left: 4px solid var(--gold);
            border-radius: 6px;
            padding: 22px 26px;
            color: #f3e6d0;
        }

        .scope-darshan .policy-notice h4 {
            font-family: "Fraunces", serif;
            color: #fff;
            font-size: 15px;
            margin: 0 0 8px;
        }

        .scope-darshan .policy-notice p {
            font-size: 13.5px;
            line-height: 1.65;
            margin: 0;
            color: #e7d9c8;
        }

        @media (max-width:600px) {
            .scope-darshan .page-hero h1 {
                font-size: 26px;
            }

            .scope-darshan .info-row {
                flex-direction: column;
                gap: 4px;
            }

            .scope-darshan .info-row .value {
                text-align: left;
            }
        }

        }

        @media (max-width:700px) {
            .scope-darshan .footer-essentials {
                flex-direction: column;
